
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101016">
<title>IPA Manager</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px 18px;padding-top:max(24px,env(safe-area-inset-top));background:#101016;color:#f5f5fa;font:16px -apple-system,BlinkMacSystemFont,sans-serif}
main{max-width:650px;margin:auto}
h1{font-size:30px;margin-bottom:5px}
h2{font-size:20px}
.muted{color:#a5a5b7;overflow-wrap:anywhere}
.panel{border:1px solid #353543;border-radius:18px;padding:18px;margin-top:20px;background:#1b1b25}
.picker,button{display:block;width:100%;border:0;border-radius:12px;padding:14px;background:#8b7cff;color:#111118;font-weight:700;text-align:center;font-size:15px;cursor:pointer;margin-top:10px}
#files{display:none}
.card{display:flex;gap:13px;align-items:flex-start;padding:16px 0;border-top:1px solid #353543}
.appicon{width:68px;height:68px;flex-shrink:0;object-fit:contain;border-radius:15px;background:#292936}
.info{min-width:0;flex:1}
.name{font-weight:700;overflow-wrap:anywhere}
.details{font-size:13px;line-height:1.7;color:#aaaabd;overflow-wrap:anywhere;margin-top:6px}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.actions button{width:auto;flex:1;min-width:100px;margin:0;padding:10px;background:#353543;color:white}
#status{color:#c8c1ff;overflow-wrap:anywhere}
</style>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
<main>
<h1>IPA Manager</h1>
<p class="muted">Tu biblioteca personal de aplicaciones iOS</p>

<section class="panel">
<h2>＋ Importar aplicaciones</h2>
<p class="muted">Selecciona archivos IPA desde Archivos de iOS.</p>
<label class="picker" for="files">Seleccionar archivos IPA</label>
<input id="files" type="file" accept=".ipa,application/octet-stream" multiple>
<p id="status" role="status">Iniciando biblioteca…</p>
</section>

<section class="panel">
<h2>Mi biblioteca</h2>
<p id="count" class="muted">Cargando…</p>
<div id="library"></div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
let db;

function openDB(){
 return new Promise((resolve,reject)=>{
  const r=indexedDB.open('IPAManagerDB',1);
  r.onupgradeneeded=()=>{
   if(!r.result.objectStoreNames.contains('ipas'))
    r.result.createObjectStore('ipas',{keyPath:'id'});
  };
  r.onsuccess=()=>resolve(r.result);
  r.onerror=()=>reject(r.error);
 });
}

function req(r){
 return new Promise((resolve,reject)=>{
  r.onsuccess=()=>resolve(r.result);
  r.onerror=()=>reject(r.error);
 });
}

function getAll(){
 return req(db.transaction('ipas','readonly').objectStore('ipas').getAll());
}

function getOne(id){
 return req(db.transaction('ipas','readonly').objectStore('ipas').get(id));
}

function save(item){
 return new Promise((resolve,reject)=>{
  const tx=db.transaction('ipas','readwrite');
  tx.objectStore('ipas').put(item);
  tx.oncomplete=resolve;
  tx.onerror=()=>reject(tx.error);
  tx.onabort=()=>reject(tx.error);
 });
}

function remove(id){
 return new Promise((resolve,reject)=>{
  const tx=db.transaction('ipas','readwrite');
  tx.objectStore('ipas').delete(id);
  tx.oncomplete=resolve;
  tx.onerror=()=>reject(tx.error);
 });
}

function fmt(n){
 return n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB';
}

function childValue(dict,key){
 if(!dict)return null;
 const children=Array.from(dict.children);
 for(let i=0;i<children.length;i++){
  if(children[i].tagName==='key'&&children[i].textContent===key){
   return children[i+1]||null;
  }
 }
 return null;
}

function plistString(dict,key){
 const node=childValue(dict,key);
 if(node&&['string','integer','real'].includes(node.tagName))return node.textContent;
 return '';
}

function iconNames(dict){
 const names=[];
 const files=childValue(dict,'CFBundleIconFiles');
 if(files&&files.tagName==='array'){
  for(const n of files.children){
   if(n.tagName==='string')names.push(n.textContent);
  }
 }
 const primary=childValue(dict,'CFBundlePrimaryIcon');
 if(primary&&primary.tagName==='dict'){
  const nested=childValue(primary,'CFBundleIconFiles');
  if(nested&&nested.tagName==='array'){
   for(const n of nested.children){
    if(n.tagName==='string')names.push(n.textContent);
   }
  }
 }
 return [...new Set(names)];
}

async function analyze(file){
 if(!window.JSZip)throw Error('No se pudo cargar JSZip. Comprueba tu conexión.');

 const zip=await JSZip.loadAsync(file);
 const paths=Object.keys(zip.files);
 const infoPath=paths.find(p=>/^Payload\/[^/]+\.app\/Info\.plist$/i.test(p)&&!zip.files[p].dir);
 if(!infoPath)throw Error('No se encontró Info.plist dentro de Payload.');

 const appDir=infoPath.slice(0,infoPath.lastIndexOf('/')+1);
 const bytes=await zip.file(infoPath).async('uint8array');

 if(bytes[0]===0x62&&bytes[1]===0x70&&bytes[2]===0x6c&&bytes[3]===0x69){
  throw Error('Info.plist binario: todavía no compatible.');
 }

 const doc=new DOMParser().parseFromString(new TextDecoder().decode(bytes),'application/xml');
 if(doc.querySelector('parsererror'))throw Error('Info.plist XML no válido.');
 const dict=doc.querySelector('plist > dict');
 if(!dict)throw Error('No se encontró el diccionario de Info.plist.');

 const metadata={
  appName:plistString(dict,'CFBundleDisplayName')||plistString(dict,'CFBundleName')||'Aplicación iOS',
  version:plistString(dict,'CFBundleShortVersionString')||'Desconocida',
  build:plistString(dict,'CFBundleVersion')||'Desconocido',
  bundleId:plistString(dict,'CFBundleIdentifier')||'Desconocido',
  iconData:null,
  iconNote:'Icono no disponible'
 };

 const names=iconNames(dict);
 const pngs=paths.filter(p=>
  !zip.files[p].dir &&
  p.startsWith(appDir) &&
  /\.png$/i.test(p)
 );

 let candidates=[];
 for(const name of names){
  const base=name.split('/').pop();
  candidates.push(...pngs.filter(p=>{
   const actual=p.split('/').pop().replace(/@\dx(?=\.png$)/i,'');
   return actual.toLowerCase()===base.toLowerCase()+'.png';
  }));
 }

 if(!candidates.length){
  candidates=pngs.filter(p=>
   /(app.?icon|^icon|icon[-_])/i.test(p.split('/').pop())
  );
 }

 candidates=[...new Set(candidates)].sort((a,b)=>{
  const sa=zip.files[a]._data?.uncompressedSize||0;
  const sb=zip.files[b]._data?.uncompressedSize||0;
  return sb-sa;
 });

 if(candidates.length){
  const entry=zip.file(candidates[0]);
  const base64=await entry.async('base64');
  metadata.iconData='data:image/png;base64,'+base64;
  metadata.iconNote='Icono extraído del IPA';
 }else{
  metadata.iconNote='El icono puede estar dentro de Assets.car';
 }

 // Analizar archivos relacionados con la firma del IPA
 const signatureFiles = Object.keys(zip.files).filter(path =>
  /(^|\/)embedded\.mobileprovision$/i.test(path) ||
  /(^|\/)_CodeSignature\/CodeResources$/i.test(path)
 );

 metadata.signatureFiles = signatureFiles;
 metadata.hasProvisioningProfile = signatureFiles.some(path =>
  /(^|\/)embedded\.mobileprovision$/i.test(path)
 );
 metadata.hasCodeResources = signatureFiles.some(path =>
  /(^|\/)_CodeSignature\/CodeResources$/i.test(path)
 );

 if (metadata.hasProvisioningProfile && metadata.hasCodeResources) {
  metadata.signatureNote = 'Se encontraron el perfil y los recursos de firma';
 } else if (metadata.hasProvisioningProfile) {
  metadata.signatureNote = 'Perfil de aprovisionamiento encontrado';
 } else if (metadata.hasCodeResources) {
  metadata.signatureNote = 'Recursos de firma encontrados; falta comprobar el perfil';
 } else {
  metadata.signatureNote = 'No se encontraron los archivos de firma habituales';
 }

 return metadata;
}

function make(tag,cls,text){
 const e=document.createElement(tag);
 if(cls)e.className=cls;
 if(text!==undefined)e.textContent=text;
 return e;
}

async function render(){
 const items=(await getAll()).sort((a,b)=>b.added-a.added);
 const root=$('library');
 root.replaceChildren();
 $('count').textContent=`${items.length} aplicaciones · ${fmt(items.reduce((n,x)=>n+x.size,0))}`;

 for(const file of items){
  const card=make('div','card');
  const icon=make('img','appicon');
  icon.alt='Icono de '+file.name;
  icon.src=file.metadata?.iconData||'data:image/svg+xml,'+encodeURIComponent(
   '<svg xmlns="http://www.w3.org/2000/svg" width="68" height="68"><rect width="68" height="68" rx="15" fill="#292936"/><text x="34" y="43" font-size="30" text-anchor="middle" fill="#b9b0ff">IPA</text></svg>'
  );
  card.append(icon);

  const info=make('div','info');
  info.append(make('div','name',file.metadata?.appName||file.name));
  info.append(make('div','details',
   `${file.name}\n${fmt(file.size)}\nVersión: ${file.metadata?.version||'Sin analizar'}`
  ));

  const actions=make('div','actions');
  const analyzeBtn=make('button','',file.metadata?'Actualizar datos':'Analizar IPA');
  analyzeBtn.addEventListener('click',async()=>{
   analyzeBtn.disabled=true;
   $('status').textContent='Analizando '+file.name+'…';
   try{
    const metadata=await analyze(file.blob);
    await save({...file,metadata});
    $('status').textContent=metadata.iconData?
     'Análisis e icono completados.':
     'Datos extraídos. '+metadata.iconNote+'.';
    await render();
   }catch(e){
    $('status').textContent=e.message||'No se pudo analizar el IPA.';
    analyzeBtn.disabled=false;
   }
  });

  const detailsBtn=make('button','secondary','Detalles');
  detailsBtn.addEventListener('click',()=>{
   const m=file.metadata;
   alert(m?
    `Aplicación: ${m.appName}\nVersión: ${m.version}\nBuild: ${m.build}\nBundle ID: ${m.bundleId}\n${m.iconNote}`:
    'Pulsa Analizar IPA para leer los detalles.');
  });

  const deleteBtn=make('button','secondary','Eliminar');
  deleteBtn.addEventListener('click',async()=>{
   if(!confirm('¿Eliminar '+file.name+' de la biblioteca?'))return;
   await remove(file.id);
   $('status').textContent='Archivo eliminado.';
   await render();
  });

  actions.append(analyzeBtn,detailsBtn,deleteBtn);
  info.append(actions);
  card.append(info);
  root.append(card);
 }
}

$('files').addEventListener('change',async()=>{
 let added=0;
 for(const file of Array.from($('files').files||[])){
  if(!file.name.toLowerCase().endsWith('.ipa'))continue;
  const id=[file.name,file.size,file.lastModified].join('|');
  if(await getOne(id))continue;
  try{
   await save({id,name:file.name,size:file.size,lastModified:file.lastModified,added:Date.now(),blob:file,metadata:null});
   added++;
  }catch(e){
   $('status').textContent='No se pudo guardar '+file.name+'. Comprueba el espacio disponible.';
  }
 }
 $('files').value='';
 await render();
 $('status').textContent=`Importación terminada. Nuevos archivos: ${added}.`;
});

(async()=>{
 try{
  db=await openDB();
  await render();
  $('status').textContent='Biblioteca local preparada.';
 }catch(e){
  $('status').textContent='Error de almacenamiento: '+e.message;
 }
})();
</script>
</body>
</html>
